version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - node --version
        - npm --version
        - npm install --global npm@11.19.1 --no-audit --no-fund
        - npm --version
        - if [ -d node_modules ]; then mv node_modules "/tmp/helpmehack-node_modules-${AWS_JOB_ID:-stale}"; fi
        - npm install --no-audit --no-fund
    build:
      commands:
        - env | grep -E '^(GITHUB_APP_ID|GITHUB_APP_INSTALLATION_ID|GITHUB_APP_PRIVATE_KEY_BASE64|GITHUB_TOKEN|GITHUB_DISCOVERY_TOKEN|UPSTASH_REDIS_REST_URL|UPSTASH_REDIS_REST_TOKEN|KV_REST_API_URL|KV_REST_API_TOKEN|UPSTASH_REDIS_REST_KV_REST_API_URL|UPSTASH_REDIS_REST_KV_REST_API_TOKEN|OPPORTUNITY_INDEX_TARGET|OPPORTUNITY_INDEX_BATCH_SIZE|OPPORTUNITY_INDEX_CONCURRENCY|OPPORTUNITY_INDEX_KEY|REFRESH_SECRET|NEWSLETTER_ENDPOINT|NEWSLETTER_API_TOKEN)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
