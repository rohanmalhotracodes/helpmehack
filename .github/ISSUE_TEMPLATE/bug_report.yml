name: Bug report
description: Report a reproducible problem in HelpMeHack
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first and provide enough detail for someone else to reproduce the problem.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Tell us what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Tell us what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable set of steps.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home
        - Feed
        - Repos
        - Repository details
        - Search / filtering
        - Data refresh / GitHub integration
        - AWS / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device / environment
      placeholder: "Example: Chrome 140 on macOS, Android Chrome, Node 22"
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Remove secrets, tokens, email addresses, and other private information before posting.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and private information from logs or screenshots.
          required: true
